<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>철거의 기준은 이제 거왕입니다.</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
    <style>
        /* 기본 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #000; overflow: hidden; height: 100vh; }
        .blue-text {
    color: #007bff; /* 원하시는 파란색 코드로 변경 가능합니다 */
}
        /* [이미지 관련 코드] 구조 유지 */
        .slideshow-container { position: fixed; width: 100%; height: 100%; z-index: 1; }
        .slideshow-container img {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slideshow-container img.active { opacity: 1; }

        /* 중앙 콘텐츠 영역 */
        .content {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center;
            color: white; z-index: 100; width: 100%;
        }

        /* [수정] 주식회사 거왕: 부드러운 폰트 + 강력한 다중 그림자 */
        .content h1 { 
            font-size: 4rem; 
            font-weight: 900; 
            margin-bottom: 15px;
            /* 여러 겹의 그림자를 넣어 글자를 부드럽고 선명하게 만듦 */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.3);
            letter-spacing: -1.5px;
        }
        
        .content p { 
            font-size: 1.6rem; 
            font-weight: 500; 
            margin-bottom: 50px;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        /* [수정] ENTER SITE 버튼: 노란색 제거 -> 실버 메탈(은색) 배경 */
        .enter-btn { 
            display: inline-block; 
            padding: 22px 90px; 
            font-size: 1.4rem;
            /* 은색 메탈릭 그라데이션 적용 */
            background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 50%, #757575 100%);
            color: #1a1a1a; 
            text-decoration: none; 
            font-weight: 900; 
            border-radius: 4px; 
            border: 1px solid #ffffff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.5);
            transition: 0.3s;
            text-transform: uppercase; /* 영어로 변경 */
        }
        
        .enter-btn:hover { 
            transform: scale(1.05); 
            background: linear-gradient(135deg, #ffffff, #e0e0e0, #bdbdbd);
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .content h1 { font-size: 2.5rem; }
            .content p { font-size: 1.2rem; }
            .enter-btn { padding: 18px 50px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="slideshow-container" id="slideshow">
        <img src="https://github.com/Hong-gghdd/geowang/blob/main/3.jpeg?raw=true" class="active">
        <img src="https://github.com/Hong-gghdd/geowang/blob/main/8.jpeg?raw=true" class="">
        <img src="https://github.com/Hong-gghdd/geowang/blob/main/9.jpeg?raw=true" class="">
    </div>

   <div class="content">
    <h1><span class="blue-text">주식회사 거왕</span></h1>
    <p>공장⬝상가⬝주택 철거 전문기업</p>
    <a href="main.html" class="enter-btn">ENTER SITE</a>
</div>

    <script>
        let currentIdx = 0;
        const imgs = document.getElementById('slideshow').getElementsByTagName('img');
        
        // 슬라이드 간격 3초(3000ms)로 적용
        setInterval(() => {
            imgs[currentIdx].classList.remove('active');
            currentIdx = (currentIdx + 1) % imgs.length;
            imgs[currentIdx].classList.add('active');
        }, 3000);
    </script>

</body>
</html>

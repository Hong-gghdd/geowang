<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>철거의 기준은 이제 거왕입니다.</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #000; 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .blue-text {
            color: #007bff;
        }

        /* 슬라이드 영역: pointer-events를 주어 클릭이나 터치를 방해하지 않도록 설정 */
        .slideshow-container { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            pointer-events: none; 
        }
        .slideshow-container img {
            position: absolute; 
            width: 100%; 
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slideshow-container img.active { opacity: 1; }

        /* 중앙 콘텐츠 영역: z-index를 높여 무조건 맨 위에 오도록 설정 */
        .content {
            position: relative;
            text-align: center;
            color: white; 
            z-index: 10; 
            width: 100%;
            padding: 20px;
        }

        .content h1 { 
            font-size: 3.5rem; 
            font-weight: 900; 
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.3);
            letter-spacing: -1.5px;
        }
        
        .content p { 
            font-size: 1.5rem; 
            font-weight: 500; 
            margin-bottom: 40px;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        .enter-btn { 
            display: inline-block; 
            padding: 20px 70px; 
            font-size: 1.3rem;
            background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 50%, #757575 100%);
            color: #1a1a1a; 
            text-decoration: none; 
            font-weight: 900; 
            border-radius: 4px; 
            border: 1px solid #ffffff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.5);
            transition: 0.3s;
            text-transform: uppercase;
        }
        
        .enter-btn:hover { 
            transform: scale(1.05); 
            background: linear-gradient(135deg, #ffffff, #e0e0e0, #bdbdbd);
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .content h1 { font-size: 2.2rem; }
            .content p { font-size: 1.1rem; margin-bottom: 30px; }
            .enter-btn { padding: 15px 45px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="slideshow-container" id="slideshow">
        <img src="https://github.com/Hong-gghdd/geowang/blob/main/3.jpeg?raw=true" class="active" alt="슬라이드1">
        <img src="https://github.com/Hong-gghdd/geowang/blob/main/8.jpeg?raw=true" alt="슬라이드2">
        <img src="https://github.com/Hong-gghdd/geowang/blob/main/9.jpeg?raw=true" alt="슬라이드3">
    </div>

    <div class="content">
        <h1><span class="blue-text">주식회사 거왕</span></h1>
        <p>공장⬝상가⬝주택 철거 전문기업</p>
        <a href="main.html" class="enter-btn">ENTER SITE</a>
    </div>

    <script>
        let currentIdx = 0;
        const imgs = document.getElementById('slideshow').getElementsByTagName('img');
        
        setInterval(() => {
            imgs[currentIdx].classList.remove('active');
            currentIdx = (currentIdx + 1) % imgs.length;
            imgs[currentIdx].classList.add('active');
        }, 3000);
    </script>

</body>
</html>
